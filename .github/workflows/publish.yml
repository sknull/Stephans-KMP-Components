name: Stephans-KMP-Components CI

on:
  push:
    branches: [ "main" ]
#    paths:
#      - 'library/**'
#      - 'gradle/**'
#      - '*.kts'

  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # macOS ist für KMP am stabilsten (auch wenn du noch kein iOS hast)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Tests
        run: ./gradlew :library:test :library:desktopTest

      - name: Build Library
        run: ./gradlew :library:assemble

      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew :library:publish --no-configuration-cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
